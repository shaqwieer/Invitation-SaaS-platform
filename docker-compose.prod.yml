# Production overlay. Apply on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Switches both apps to their production build targets and drops the source bind
# mounts, so containers run the built artefacts rather than the working tree.
services:
  postgres:
    # Not published to the host: only the API needs it, over the compose network.
    ports: !override []

  api:
    build:
      target: production
    environment:
      NODE_ENV: production
      # Required behind nginx — without it every request reports the proxy's IP
      # and all callers share a single rate-limit bucket.
      TRUST_PROXY: 1
    volumes: !override []
    # The image's CMD already runs `prisma migrate deploy` before starting.
    command: !reset null
    # Loopback only — nginx is the sole caller. The host port is configurable
    # because a VPS often already runs something on 4000; nginx must then be
    # pointed at the same value. The container port never moves.
    #
    # !override, not a plain list: a plain list merges with the base file's
    # '4000:4000' rather than replacing it, so the service would keep publishing
    # on every interface — and on a host where 4000 is taken, fail the bind.
    ports: !override
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'

  web:
    build:
      target: production
      args:
        # Baked into the client bundle at build time — a runtime value is ignored.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to your public https origin before building}
    environment:
      NODE_ENV: production
    volumes: !override []
    # !override for the same reason as the API above.
    ports: !override
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
